esphome:
  name: hydroponik-fuellstand
  friendly_name: Hydroponik Füllstand

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  baud_rate: 0

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

uart:
  id: uart_a02yyuw
  rx_pin: GPIO16
  tx_pin: GPIO17
  baud_rate: 9600

sensor:
  - platform: a02yyuw
    name: "Hydroponik Ultraschall Abstand"
    id: hydroponik_ultraschall_abstand
    uart_id: uart_a02yyuw
    update_interval: 2s
    unit_of_measurement: "cm"
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
      - median:
          window_size: 7
          send_every: 5
          send_first_at: 3
